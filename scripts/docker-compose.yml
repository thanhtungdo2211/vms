# Docker Compose v2 configuration for VMSx VMS Core (WSL2 + RTX 5070)
services:
  vmsx:
    build:
      context: ..
      dockerfile: scripts/Dockerfile
    container_name: vmsx-face-spa
    restart: unless-stopped
    env_file:
      - .env

    # GPU access via nvidia-container-toolkit (WSL2)
    runtime: nvidia

    # Also declare deploy reservations for compose v2 compatibility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute, utility]

    # Network configuration
    network_mode: host

    volumes:
      # Mount project directory to both /app and original path for compatibility
      - ..:/app
      # - /home/mq/disk2T/quangnv/face:/home/mq/disk2T/quangnv/face

    # Environment variables (from .env + defaults)
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - GST_DEBUG=${GST_DEBUG:-2,v4l2*:1}
      - PYTHONUNBUFFERED=1
      - DISPLAY=${DISPLAY:-:0}

    # Interactive mode for debugging
    stdin_open: true
    tty: true

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/api/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
