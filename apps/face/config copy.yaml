elements:
  - type: queue
    name: queue0
  - type: nvvideoconvert
    name: pre_tiler_conv
    properties:
      nvbuf-memory-type: 2
  - type: capsfilter
    name: rgba_caps
    caps: "video/x-raw(memory:NVMM), format=RGBA"
  - type: nvinfer
    name: pgie
    config_file: "data/face/models/scrfd640/infer.txt"
  - type: nvtracker
    name: tracker
    config_file: "data/face/models/NvDCF/config_tracker.txt"
    probes: {src: tracker_probe}
  - type: nvinfer
    name: sgie
    config_file: "data/face/models/arcface/infer.txt"
    probes: {src: sgie_probe, sink: recognition_fps_probe}