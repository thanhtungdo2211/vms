





# ==========================================
# Face Recognition Processor Configuration
# ==========================================

# ---- PostgreSQL Database ----
database:
  enabled: true
  host: "192.168.6.229"
  port: 5432
  name: "iotvms_new"
  user: "postgres"
  password: "admin123"
  # Full URL (used if provided, overrides host/port/name/user/password)
  url: "postgresql://postgres:admin123@192.168.6.229:5432/iotvms_new"

# ---- Qdrant Vector DB ----
qdrant:
  host: "192.168.6.16"
  port: 6386
  api_key: null
  collection: "user_features_cosine"

params:
  l2_threshold: 1.0
  min_streak: 3

  # ---- Recognition thresholds ----
  pg_sim_high: 0.65
  pg_sim_low: 0.52
  pg_sim_floor: 0.45
  qdrant_threshold: 0.50
  qdrant_low_threshold: 0.45
  vote_threshold: 3
  stable_frames: 15
  min_unknown_frames_before_create: 30
  recheck_cooldown_sec: 3.0
  qdrant_cooldown_sec: 5.0

  # ---- Alert cooldown ----
  alert_cooldown_sec: 20

  # ---- HTTP Event Sending ----
  http_event:
    base_url: "http://192.168.6.39:5555"
    endpoint: "/api/v1/event/access-events"
    token: ""
    stream_id: 1
    timeout: 60.0

# sink:
#   enable: true
#   type: filesink   # Main sink is fakesink, real output via demux RTSP
#   properties:
#     sync: false

# sink:
#   enable: true
#   type: fakesink   # Các loại: filesink, fakesink, rtsp, display
#   properties:
#     location: "${OUTPUT_DIR:data/face/output_recognition.avi}"
#     sync: false
#     qos: false

sink:
  enable: true
  type: multifilesink
  properties:
    location: "data/face/test-output2/frame_%05d.jpg"
    max-files: 100
    quality: 85

muxer:
  batch-size: 16
  width: 1920
  height: 1080
  nvbuf-memory-type: 2
  batched-push-timeout: 40000
  live-source: 1

