params:
  features_json: "${FEATURES_JSON:data/face/features.json}"
  l2_threshold: 1.0
  min_streak: 3

sink:
  enable: true
  type: fakesink   # Main sink is fakesink, real output via demux RTSP
  properties:
    sync: false

muxer:
  batch-size: 8
  width: 1920
  height: 1080
  nvbuf-memory-type: 0
  batched-push-timeout: 40000
  live-source: 1

# Demux BEFORE OSD - each camera gets its own OSD in RTSP chain
# Architecture: mux → PGIE → Tracker → SGIE → nvstreamdemux → (per-cam: OSD → enc → RTSP)
elements:
  - type: queue
  - type: nvvideoconvert
    name: pre_infer_conv
    properties: { nvbuf-memory-type: 3 }
  - type: capsfilter
    name: rgba_caps
    caps: "video/x-raw(memory:NVMM), format=RGBA"
  - type: nvinfer
    name: pgie
    config_file: "data/face/models/scrfd640/infer.txt"
  - type: nvtracker
    name: tracker
    config_file: "data/face/models/NvDCF/config_tracker.txt"
    probes: {src: tracker_probe}
  - type: nvinfer
    name: sgie
    config_file: "data/face/models/arcface/infer.txt"
    probes: {src: sgie_probe}
  - type: nvstreamdemux
    name: demux
