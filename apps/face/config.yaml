params:
  # Qdrant vector database connection
  qdrant_host: "${QDRANT_HOST:localhost}"
  qdrant_port: "${QDRANT_PORT:6333}"
  qdrant_collection: "${QDRANT_COLLECTION:faces}"
  # Matching thresholds
  l2_threshold: 1.0
  min_streak: 3
  reid_interval: 20              # ← THÊM: giảm từ default 30 xuống 15 frames
  skip_reid: 3

  # Tracker lifetime — phải đủ lâu để auto-save worker kịp chạy
  tracker_max_age: 300          # 300 frames @ 25fps = 12s
  tracker_cleanup_interval: 150 # cleanup mỗi 6s
  cleanup_interval: 10
  # Auto-save: capture diverse embeddings of confirmed faces → improve hard-case recall
  # (masked/covered faces will be recognized on next appearance)
  auto_save_enabled: true
  auto_save_l2_threshold: 0.9   # Only buffer embeddings with L2 dist < this (high confidence)
  auto_save_interval: 10         # Seconds between flushes to Qdrant
  auto_save_max_per_run: 3       # Max embeddings saved per tracker per flush
  auto_save_max_total: 20        # Max auto-saved embeddings per person in Qdrant
  auto_save_buffer_size: 10      # Ring-buffer size per tracker

# sink:
#   enable: true
#   type: filesink   # Main sink is fakesink, real output via demux RTSP
#   properties:
#     sync: false

sink:
  enable: true
  type: filesink   # Các loại: filesink, fakesink, rtsp, display
  properties:
    location: "${OUTPUT_DIR:data/face/output_recognition.avi}"
    sync: false
    qos: false

muxer:
  batch-size: 4
  width: 1920
  height: 1080
  nvbuf-memory-type: 4
  batched-push-timeout: 40000
  live-source: 1

# Demux BEFORE OSD - each camera gets its own OSD in RTSP chain
# Architecture: mux → PGIE → Tracker → SGIE → nvstreamdemux → (per-cam: OSD → enc → RTSP)

# elements:
#   - type: queue
#   - type: nvvideoconvert
#     name: pre_tiler_conv
#   - type: capsfilter
#     name: rgba_caps
#     caps: "video/x-raw(memory:NVMM), format=RGBA"
#   - type: nvinfer
#     config_file: "data/face/models/scrfd640/infer.txt"
#   - type: nvtracker
#     config_file: "data/face/models/NvDCF/config_tracker.txt"
#     probes: {src: tracker_probe}
#   - type: nvinfer
#     config_file: "data/face/models/arcface/infer.txt"
#     probes: {src: sgie_probe, sink: recognition_fps_probe}

elements:
  - type: queue
  - type: nvvideoconvert
    name: pre_tiler_conv
  - type: capsfilter
    name: rgba_caps
    caps: "video/x-raw(memory:NVMM), format=RGBA"
  - type: nvinfer
    name: pgie
    config_file: "data/face/models/scrfd640/infer.txt"
  - type: nvtracker
    name: tracker
    config_file: "data/face/models/NvDCF/config_tracker.txt"
    probes: {src: tracker_probe}
  - type: nvinfer
    name: sgie
    config_file: "data/face/models/arcface/infer.txt"
    probes: {src: sgie_probe, sink: recognition_fps_probe}
  - type: nvmultistreamtiler
    properties: { rows: 2, columns: 2, width: 1920, height: 1080 }
  - type: nvdsosd
    properties: { process-mode: 0, display-text: 1 }
