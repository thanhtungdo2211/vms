params:
  l2_threshold: 1.0
  min_streak: 3

  # ---- Recognition thresholds ----
  pg_sim_high: 0.65          # was 0.58 — instant match chặt hơn
  pg_sim_low: 0.52           # was 0.45 — voting chặt hơn
  pg_sim_floor: 0.45         # was 0.40 — fallback Qdrant chặt hơn
  qdrant_threshold: 0.50     # was 0.40 — Qdrant match chặt hơn
  qdrant_low_threshold: 0.45 # was 0.40 — recheck chặt hơn
  vote_threshold: 3          # was 2   — cần 3 votes thay vì 2
  stable_frames: 15
  min_unknown_frames_before_create: 30  # was 20 — chờ lâu hơn
  recheck_cooldown_sec: 3.0
  qdrant_cooldown_sec: 5.0

  # ---- Alert cooldown ----
  alert_cooldown_sec: 20

  # ---- HTTP Event Sending ----
  http_event:
    base_url: "http://192.168.6.39:5555"
    endpoint: "/api/v1/event/access-events"
    token: ""
    stream_id: 1
    timeout: 60.0

# sink:
#   enable: true
#   type: filesink   # Main sink is fakesink, real output via demux RTSP
#   properties:
#     sync: false

sink:
  enable: true
  type: filesink   # Các loại: filesink, fakesink, rtsp, display
  properties:
    location: "${OUTPUT_DIR:data/face/output_recognition.avi}"
    sync: false
    qos: false

muxer:
  batch-size: 16
  width: 1920
  height: 1080
  nvbuf-memory-type: 0
  batched-push-timeout: 40000
  live-source: 1

# Demux BEFORE OSD - each camera gets its own OSD in RTSP chain
# Architecture: mux → PGIE → Tracker → SGIE → nvstreamdemux → (per-cam: OSD → enc → RTSP)
# elements:
#   - type: queue
#   - type: nvvideoconvert
#     name: pre_tiler_conv
#   - type: capsfilter
#     name: rgba_caps
#     caps: "video/x-raw(memory:NVMM), format=RGBA"
#   - type: nvinfer
#     config_file: "data/face/models/scrfd640/infer.txt"
#   - type: nvtracker
#     config_file: "data/face/models/NvDCF/config_tracker.txt"
#     probes: {src: tracker_probe}
#   - type: nvinfer
#     config_file: "data/face/models/arcface/infer.txt"
#     probes: {src: sgie_probe, sink: recognition_fps_probe}
#   - type: nvstreamdemux

elements:
  - type: queue
  - type: nvvideoconvert
    name: pre_tiler_conv
  - type: capsfilter
    name: rgba_caps
    caps: "video/x-raw(memory:NVMM), format=RGBA"
  - type: nvinfer
    name: pgie
    config_file: "data/face/models/scrfd640/infer.txt"
  - type: nvtracker
    name: tracker
    config_file: "data/face/models/NvDCF/config_tracker.txt"
    probes: {src: tracker_probe}
  - type: nvinfer
    name: sgie
    config_file: "data/face/models/arcface/infer.txt"
    probes: {src: sgie_probe, sink: recognition_fps_probe}
  - type: nvmultistreamtiler
    properties: { rows: 2, columns: 2, width: 1920, height: 1080 }
  - type: nvdsosd
    properties: { process-mode: 0, display-text: 1 }
    # probes: {src: recognition_fps_probe}
  
